apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: veralabel
resources:
  - kubernetes/base/namespace.yaml
  - kubernetes/base/configmap.yaml
  - kubernetes/base/storage.yaml
  - kubernetes/base/mongodb.yaml
  - kubernetes/base/application.yaml
configMapGenerator:
  - name: veralabel-nginx
    files:
      - nginx.conf
  - name: veralabel-mongo-init
    files:
      - 01-app-user.js=docker/mongo-init.js
images:
  # Replace newName/newTag with the registry and immutable tag you push.
  - name: veralabel
    newName: ghcr.io/YOUR_ACCOUNT/veralabel
    newTag: v1
