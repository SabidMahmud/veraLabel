worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Preserve the public scheme when a trusted HTTPS proxy/Ingress is in front.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        location = /_image_auth {
            internal;
            proxy_pass http://web:3000/api/images/access;
            proxy_pass_request_body off;
            proxy_set_header Content-Length '';
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
        # Dotfiles in a mounted dataset are never served.
        location ~ /\. { deny all; }
        location /images/ {
            auth_request /_image_auth;
            alias /usr/share/nginx/images/;
            autoindex off;
            add_header Cache-Control 'private, no-store' always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
