apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: veralabel
spec:
  selector:
    app: veralabel
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: veralabel
  namespace: veralabel
spec:
  selector:
    app: veralabel
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veralabel
  namespace: veralabel
spec:
  replicas: 1
  # Avoid two Pods competing for a single-node image PVC during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: veralabel
  template:
    metadata:
      labels:
        app: veralabel
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      # For a private registry, uncomment after creating this Secret.
      # imagePullSecrets:
      #   - name: registry-credentials
      initContainers:
        - name: seed-admin
          image: veralabel
          command: [node, scripts/seed-admin.js]
          envFrom:
            - configMapRef: {name: veralabel-config}
            - secretRef: {name: veralabel-secrets}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: web
          image: veralabel
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: veralabel-config}
            - secretRef: {name: veralabel-secrets}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /api/live, port: 3000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/live, port: 3000}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
        - name: proxy
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - name: images
              mountPath: /usr/share/nginx/images
              readOnly: true
            - name: nginx
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: veralabel-images
        - name: nginx
          configMap:
            name: veralabel-nginx
