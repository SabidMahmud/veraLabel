apiVersion: v1
kind: ConfigMap
metadata:
  name: veralabel-config
  namespace: veralabel
data:
  # Must match the URL your browser uses. Change before enabling Ingress.
  NEXTAUTH_URL: http://localhost:8080
  AUTH_URL: http://localhost:8080
  AUTH_TRUST_HOST: 'true'
  AUTH_BYPASS: 'false'
  # Optional SMTP. Add SMTP_USER and SMTP_PASS to veralabel-secrets.
  SMTP_HOST: ''
  SMTP_PORT: '587'
  SMTP_SECURE: 'false'
  SMTP_FROM: VeraLabel <noreply@example.com>
