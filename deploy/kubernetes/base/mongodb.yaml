apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: veralabel
spec:
  clusterIP: None
  selector:
    app: veralabel-mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: veralabel-mongodb
  namespace: veralabel
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: veralabel-mongodb
  template:
    metadata:
      labels:
        app: veralabel-mongodb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veralabel-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veralabel-secrets
                  key: MONGO_APP_PASSWORD
          volumeMounts:
            - name: database
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: [sh, -c, 'mongosh --quiet --username veralabel --password "$MONGO_APP_PASSWORD" --authenticationDatabase veralabel --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"']
            timeoutSeconds: 5
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
      volumes:
        - name: init
          configMap:
            name: veralabel-mongo-init
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
