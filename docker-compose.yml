name: veralabel

x-app-environment: &app-environment
  MONGODB_URI: mongodb://veralabel:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@db:27017/veralabel?authSource=veralabel
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
  AUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
  AUTH_TRUST_HOST: 'true'
  AUTH_BYPASS: 'false'

services:
  db:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./deploy/docker/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --username veralabel --password "$$MONGO_APP_PASSWORD" --authenticationDatabase veralabel --eval "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  seed:
    image: ${VERALABEL_IMAGE:-veralabel:local}
    build: .
    restart: 'no'
    command: [node, scripts/seed-admin.js]
    environment:
      <<: *app-environment
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${VERALABEL_IMAGE:-veralabel:local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-VeraLabel <noreply@example.com>}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_FOLDER_PATH:-./data/images}:/usr/share/nginx/images:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/live']
      interval: 15s
      timeout: 5s
      retries: 5

  import:
    image: ${VERALABEL_IMAGE:-veralabel:local}
    build: .
    profiles: [tools]
    entrypoint: [node, scripts/import-images.js]
    environment: *app-environment
    volumes:
      - ${DATA_FOLDER_PATH:-./data/images}:/data/images:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Separate from the old MongoDB 6 volume; never mount a MongoDB 6 data directory in 8.
  mongo_data:
